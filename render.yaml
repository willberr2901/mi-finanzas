services:
  - type: web
    name: mi-finanzas
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    # Cabeceras de seguridad (las mismas que en vercel.json)
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' blob: https://cdn.jsdelivr.net 'wasm-unsafe-eval'; worker-src 'self' blob: https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: data: https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: Referrer-Policy
        value: "no-referrer"
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains; preload"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: "same-origin"
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /version.json
        name: Cache-Control
        value: no-store
    # Abrir directamente /pagos, /mercado, etc. sin error 404
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
